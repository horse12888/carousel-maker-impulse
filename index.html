<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davide Di Leo - Carousel Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <!-- Librerie per l'esportazione PNG e ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        @import url('https://fonts.cdnfonts.com/css/open-sauce-one');
        
        body { 
            font-family: 'Hanken Grotesk', sans-serif; 
            background-color: #0a0a0a; 
            color: white; 
        }

        .carousel-track { 
            display: flex; 
            gap: 40px; 
            overflow-x: auto; 
            padding: 40px; 
            scroll-snap-type: x mandatory; 
            align-items: center;
            height: 100%;
        }
        
        .carousel-track::-webkit-scrollbar { height: 16px; }
        .carousel-track::-webkit-scrollbar-track { background: #1a1a1a; margin: 0 40px; border-radius: 8px;}
        .carousel-track::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; border: 4px solid #1a1a1a; }
        .carousel-track::-webkit-scrollbar-thumb:hover { background: #555; }

        .slide {
            width: 380px;
            height: 475px; /* Proporzione 4:5 per IG/LinkedIn */
            flex-shrink: 0;
            border-radius: 12px;
            position: relative;
            padding: 45px 35px;
            scroll-snap-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
            /* Rimuove background trasparenti per l'esportazione png */
            background-color: #276f8f; 
        }

        .slide-cover { padding: 0; background-size: cover; background-position: center; }
        .cover-gradient { position: absolute; bottom: 0; left: 0; width: 100%; height: 75%; background: linear-gradient(to top, rgba(0,0,0,0.95) 5%, transparent); z-index: 1; }
        .z-content { z-index: 2; position: relative; }
        
        .title-text { font-family: 'Hanken Grotesk', sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; font-size: 2.2rem; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .sub-text { font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
        
        /* Layout stile Foundr per il corpo delle slide */
        .step-number { font-family: 'Caveat', cursive; font-size: 3.2rem; font-weight: 700; line-height: 1; margin-bottom: 5px; margin-top: 15px; }
        .body-title { font-family: 'Hanken Grotesk', sans-serif; font-weight: 900; font-size: 2.3rem; margin-bottom: 25px; line-height: 1.05; letter-spacing: -0.5px; }
        .body-text { font-family: 'Hanken Grotesk', sans-serif; font-weight: 500; font-size: 1.15rem; line-height: 1.4; padding: 0 5px; }
        
        .hand-arrow { font-family: 'Open Sauce One', sans-serif; font-weight: 700; position: absolute; font-size: 1.25rem; transform: rotate(-15deg); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .logo-footer { 
            position: absolute; 
            bottom: 30px; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            z-index: 10; 
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .logo-name { font-family: 'Hanken Grotesk', sans-serif; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.5px; line-height: 1; color: #000000; }
        .logo-handle { font-family: 'Hanken Grotesk', sans-serif; font-weight: 500; font-size: 0.95rem; line-height: 1; color: #000000; }
    </style>
</head>
<body class="flex h-screen w-full overflow-hidden bg-[#0a0a0a] text-white">

    <div class="w-[360px] flex-shrink-0 bg-gray-900 p-6 overflow-y-auto border-r border-gray-800 z-20 flex flex-col">
        <h2 class="text-xl font-bold mb-6 text-white">⚙️ Pannello Generatore</h2>
        
        <div class="space-y-5 flex-1">
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-300">Colore Brand</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="bgColor" value="#276f8f" class="w-12 h-12 rounded cursor-pointer bg-gray-800 border-none p-1">
                    <span id="hexValue" class="text-sm font-mono text-gray-400">#276f8f</span>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-300">Immagine Copertina</label>
                <div class="space-y-2">
                    <input type="text" id="bgImage" value="https://images.unsplash.com/photo-1556761175-5973dc0f32d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="Inserisci URL immagine...">
                    <div class="relative">
                        <input type="file" id="localImageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <button class="w-full bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 border border-gray-600">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Oppure carica dal tuo PC
                        </button>
                    </div>
                </div>
            </div>

            <div class="pt-2 border-t border-gray-800">
                <label class="block text-sm font-medium mb-2 text-yellow-400">Preset CTA Finale</label>
                <select id="ctaPreset" onchange="applyCtaPreset()" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-yellow-500">
                    <option value="custom">-- Lascia invariata (Personalizzata) --</option>
                    <option value="preset1">Diagnosi Gratuita in 4 minuti</option>
                    <option value="preset2">IMPULSE Assessment (Business Jump)</option>
                    <option value="preset3">Guida in DM (Commenta BUSINESS)</option>
                </select>
                <p class="text-[10px] text-gray-500 mt-1">Scegliendo un preset, modificherai automaticamente la CTA nel JSON.</p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-gray-300 flex justify-between">
                    <span>Script Contenuto (JSON)</span>
                </label>
                <textarea id="scriptInput" rows="10" class="w-full bg-gray-800 text-green-400 border border-gray-700 rounded-lg p-3 text-xs focus:outline-none focus:border-green-500 font-mono"></textarea>
                <p class="text-[10px] text-gray-500 mt-1">Usa i tag [BRAND]testo[/BRAND] nel titolo della copertina per i colori di accento.</p>
            </div>
            
            <button onclick="generateFromScript()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-2 shadow-lg">
                Genera Anteprima
            </button>
        </div>

        <div class="mt-6 pt-6 border-t border-gray-800">
            <button id="downloadBtn" onclick="downloadAllSlidesAsZip()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-lg transition-all flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Esporta tutte le Slide (ZIP)
            </button>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full min-w-0 relative">
        <div class="p-8 pb-0 flex-shrink-0">
            <h1 class="text-3xl font-bold text-white">Anteprima Layout</h1>
            <p class="text-gray-400 text-sm mt-2">Usa la barra in basso o tieni premuto <kbd class="bg-gray-800 px-2 py-1 rounded text-xs">Shift</kbd> + rotellina per scorrere.</p>
        </div>

        <div class="flex-1 overflow-hidden w-full relative">
            <div class="carousel-track" id="carouselTrack">
                <!-- Le slide verranno generate qui dal JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Dati di default
        const defaultScript = {
          "cover": {
            "magazineTitle": "IMPULSE",
            "leftAnnotation": "Michael\nBaum",
            "rightAnnotation": "Founder\nSplunk",
            "title": "HA VENDUTO PER\n[BRAND]$28 MILIARDI[/BRAND]\nA CISCO",
            "subtitle": "IL PLAYBOOK DI MICHAEL BAUM"
          },
          "slides": [
            {
              "title": "Il \"Pivot\" in stile Steve Jobs.",
              "text": "Alla Drexel University, Michael vide parlare Steve Jobs. Apple stava dando un Mac a ogni studente. Quel discorso lo folgorò, convincendolo a cambiare subito facoltà per passare a informatica."
            },
            {
              "title": "Trova il problema da 28 Miliardi.",
              "text": "Fonda Splunk per aiutare le aziende con i Big Data. Ma la vera iper-crescita esplode quando si espandono nella cybersecurity. Risolvere un problema critico ad alto budget fa decollare la valutazione."
            }
          ],
          "cta": {
            "topText": "Vuoi altri casi studio?",
            "mainText": "Commenta\nBUSINESS",
            "bottomText": "e ti invierò la mia guida gratuita per founder direttamente in DM."
          }
        };

        // Database dei Preset per la CTA
        const ctaPresets = {
            "preset1": {
                "topText": "Diagnosi in 4 minuti",
                "mainText": "SCOPRI IL\nVINCOLO",
                "bottomText": "che sta limitando crescita, margini o scalabilità.\n\nLink in bio."
            },
            "preset2": {
                "topText": "Pronto per il prossimo salto?",
                "mainText": "IMPULSE\nASSESSMENT",
                "bottomText": "In 4 minuti ottieni una diagnosi gratuita su margini, acquisizione, operations, asset e readiness.\n\nFai il test dal link in bio."
            },
            "preset3": {
                "topText": "Vuoi altri casi studio?",
                "mainText": "Commenta\nBUSINESS",
                "bottomText": "e ti invierò la mia guida gratuita per founder direttamente in DM."
            }
        };

        let uploadedImageBase64 = null;

        // Gestione caricamento immagine locale
        document.getElementById('localImageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // Salva l'immagine in base64 e aggiorna l'interfaccia
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('bgImage').value = "[Foto caricata: " + file.name + "]";
                    generateFromScript(); // Aggiorna subito l'anteprima
                };
                reader.readAsDataURL(file);
            }
        });

        // Reset immagine locale se l'utente digita un nuovo URL manualmente
        document.getElementById('bgImage').addEventListener('input', function(e) {
            if (!this.value.startsWith("[Foto caricata:")) {
                uploadedImageBase64 = null;
            }
        });

        // Al caricamento della pagina
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('scriptInput').value = JSON.stringify(defaultScript, null, 2);
            generateFromScript();
        });

        function applyCtaPreset() {
            const selectedPreset = document.getElementById('ctaPreset').value;
            if(selectedPreset === 'custom') return;

            try {
                const scriptRaw = document.getElementById('scriptInput').value;
                let data = JSON.parse(scriptRaw);
                
                // Aggiorna la CTA con il preset selezionato
                data.cta = ctaPresets[selectedPreset];
                
                // Riscrive il JSON nella textarea
                document.getElementById('scriptInput').value = JSON.stringify(data, null, 2);
                
                // Rigenera subito le slide
                generateFromScript();
            } catch (error) {
                alert("Errore nel formato JSON. Assicurati che lo script sia valido prima di applicare un preset.");
            }
        }

        function generateFromScript() {
            const track = document.getElementById('carouselTrack');
            const scriptRaw = document.getElementById('scriptInput').value;
            const bgImage = uploadedImageBase64 || document.getElementById('bgImage').value;

            try {
                const data = JSON.parse(scriptRaw);
                let htmlContent = '';

                // 1. GENERAZIONE COVER SLIDE
                let titleFormatted = data.cover.title
                    .replace(/\n/g, '<br>')
                    .replace(/\[BRAND\](.*?)\[\/BRAND\]/g, `<span class="brand-text">$1</span>`);

                htmlContent += `
                <div class="slide brand-bg flex flex-col justify-between items-center" style="padding: 20px 0 0 0;">
                    <h1 style="font-family: 'Hanken Grotesk', sans-serif; font-weight: 900; font-size: 4.8rem; letter-spacing: -3px; color: #1a1a1a; line-height: 0.8; margin-bottom: 15px; z-index: 10; text-transform: uppercase;">
                        ${data.cover.magazineTitle}
                    </h1>
                    <div class="relative w-[340px] flex-1 rounded-[24px] mb-4 overflow-hidden shadow-2xl flex flex-col justify-end" style="background-image: url('${bgImage}'); background-size: cover; background-position: center;">
                        <div class="absolute bottom-0 left-0 w-full h-[85%] bg-gradient-to-t from-[#111] via-[#111]/90 to-transparent z-10"></div>
                        
                        <div class="absolute top-8 left-3 z-20 flex flex-col items-center">
                            <span class="text-[#1a1a1a] font-bold text-lg leading-none transform -rotate-6 text-center" style="font-family: 'Open Sauce One', sans-serif;">${data.cover.leftAnnotation.replace(/\n/g, '<br>')}</span>
                            <svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="mt-1 ml-4 transform rotate-12">
                                <path d="M 5 5 Q 20 10 30 35 M 15 30 L 30 35 L 35 20" />
                            </svg>
                        </div>

                        <div class="absolute top-10 right-2 z-20 flex flex-col items-center">
                            <svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="mb-1 mr-4 transform -rotate-12">
                                <path d="M 35 5 Q 20 10 10 35 M 25 30 L 10 35 L 5 20" />
                            </svg>
                            <span class="text-[#1a1a1a] font-bold text-lg leading-none transform rotate-6 text-center" style="font-family: 'Open Sauce One', sans-serif;">${data.cover.rightAnnotation.replace(/\n/g, '<br>')}</span>
                        </div>

                        <div class="relative z-20 px-4 pb-8 w-full text-center flex flex-col items-center">
                            <h2 class="title-text text-white mb-4" style="font-size: 2.2rem; line-height: 1;">
                                ${titleFormatted}
                            </h2>
                            <p class="uppercase font-bold text-gray-300 mb-6" style="font-family: 'Hanken Grotesk', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em;">
                                ${data.cover.subtitle}
                            </p>
                            <svg width="45" height="15" viewBox="0 0 50 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="brand-text">
                                <path d="M 0 10 Q 25 12 46 10 M 35 2 L 48 10 L 35 18" />
                            </svg>
                        </div>
                    </div>
                </div>`;

                // 2. GENERAZIONE SLIDES CONTENUTO
                data.slides.forEach((slide, index) => {
                    htmlContent += `
                    <div class="slide brand-bg text-white flex flex-col items-center text-center">
                        <div class="step-number text-white opacity-90">#${index + 1}</div>
                        <h3 class="body-title">${slide.title}</h3>
                        <p class="body-text">${slide.text}</p>
                        <div class="logo-footer">
                            <div class="logo-name">Davide di Leo</div>
                            <div class="logo-handle">@davidedileo.official</div>
                        </div>
                    </div>`;
                });

                // 3. GENERAZIONE CTA SLIDE (Modificata per accomodare layout più lunghi)
                htmlContent += `
                <div class="slide brand-bg text-white flex flex-col justify-center items-center text-center">
                    <div class="mt-auto mb-auto w-full">
                        <p class="font-bold text-sm uppercase tracking-widest mb-3 text-black">${data.cta.topText}</p>
                        <h3 class="title-text brand-text-invert" style="font-size: 2.8rem; text-transform: uppercase; line-height: 1;">${data.cta.mainText.replace(/\n/g, '<br>')}</h3>
                        <p class="body-text mt-5" style="white-space: pre-line;">${data.cta.bottomText}</p>
                    </div>
                    <div class="logo-footer">
                        <div class="logo-name">Davide di Leo</div>
                        <div class="logo-handle">@davidedileo.official</div>
                    </div>
                </div>`;

                // Renderizza nel DOM
                track.innerHTML = htmlContent;

                // Applica i colori
                applyColors();

            } catch (error) {
                alert("Errore nel formato JSON.");
            }
        }

        function applyColors() {
            const bgColor = document.getElementById('bgColor').value;
            document.getElementById('hexValue').textContent = bgColor;

            // Colora scritte in copertina
            document.querySelectorAll('.brand-text').forEach(el => el.style.color = bgColor);
            
            // Sfondo Slide e invertito su CTA
            document.querySelectorAll('.brand-bg').forEach(el => el.style.backgroundColor = bgColor);
            // Crea un colore scuro basato sullo sfondo brand per contrasto titoli
            document.querySelectorAll('.brand-text-invert').forEach(el => {
                el.style.color = '#1a1a1a'; // Nero antracite per massimo contrasto
            });
        }
        document.getElementById('bgColor').addEventListener('input', applyColors);

        async function downloadAllSlidesAsZip() {
            const btn = document.getElementById('downloadBtn');
            const originalHTML = btn.innerHTML;
            
            // Stato di caricamento
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Generazione PNG...
            `;
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-gray-600');

            const slides = document.querySelectorAll('.slide');
            const zip = new JSZip();

            try {
                // Loop attraverso ogni slide per "fotografarla"
                for (let i = 0; i < slides.length; i++) {
                    const slide = slides[i];
                    
                    // IMPORTANTE: Scorriamo la slide in vista prima di fare lo screenshot.
                    // Altrimenti html2canvas la taglia se è fuori dallo schermo nello scroll orizzontale.
                    slide.scrollIntoView({ behavior: 'instant', block: 'center', inline: 'center' });
                    
                    // Attendiamo 150ms per dare al DOM il tempo di renderizzare la nuova posizione
                    await new Promise(r => setTimeout(r, 150));

                    const canvas = await html2canvas(slide, {
                        scale: 2, // Scala 2x per alta risoluzione su social (760x950px output)
                        useCORS: true, // Permette le immagini cross-origin (Unsplash)
                        backgroundColor: null, // Mantiene lo sfondo trasparente sui bordi arrotondati
                        logging: false
                    });

                    // Converte il canvas in Blob (PNG file data)
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    
                    // Nomina i file: slide-1.png, slide-2.png, ecc.
                    zip.file(`slide-${i + 1}.png`, blob);
                }

                // Genera lo ZIP
                btn.innerHTML = "Impacchettamento ZIP...";
                const content = await zip.generateAsync({ type: 'blob' });
                
                // Scarica lo ZIP
                saveAs(content, 'davidedileo-carousel.zip');

            } catch (error) {
                console.error("Errore durante l'esportazione:", error);
                alert("Si è verificato un problema durante la generazione delle immagini. Controlla la console.");
            } finally {
                // Ripristina il bottone
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                btn.classList.replace('bg-gray-600', 'bg-blue-600');
                
                // Torna alla prima slide
                if(slides.length > 0) {
                    slides[0].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'start' });
                }
            }
        }
    </script>
</body>
</html>
